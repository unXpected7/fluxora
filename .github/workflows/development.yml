name: Fluxora Development

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  verify-backend:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fluxora
          POSTGRES_PASSWORD: fluxora_ci
          POSTGRES_DB: fluxora_eticket
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U fluxora -d fluxora_eticket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fluxora:fluxora_ci@localhost:54329/fluxora_eticket
      RUN_DATABASE_INTEGRATION_TESTS: "1"
      RUN_TENANT_BACKFILL_INTEGRATION_TESTS: "1"
      CLIENT_ORIGIN: http://localhost:5173,http://admin.localhost:5173,http://partner.localhost:5173,https://dev.fluxorastudio.id,https://dev-admin-eticket.fluxorastudio.id,https://dev-partner-eticket.fluxorastudio.id,https://e-ticket.fluxorastudio.id,https://admin-eticket.fluxorastudio.id,https://partner-eticket.fluxorastudio.id
      STAFF_CLIENT_ORIGIN: http://admin.localhost:5173,http://partner.localhost:5173,https://dev-admin-eticket.fluxorastudio.id,https://dev-partner-eticket.fluxorastudio.id,https://admin-eticket.fluxorastudio.id,https://partner-eticket.fluxorastudio.id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Run Chromium browser E2E
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install chromium
          npm run e2e

  deploy-development:
    if: github.event_name == 'push'
    needs: [verify-frontend, verify-backend]
    runs-on: self-hosted
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy development site
        run: |
          docker compose -f deploy/vm01/app/docker-compose.yml up --build -d dev-frontend
          docker compose -f deploy/vm01/app/docker-compose.yml ps dev-frontend
